name: Sync OpenWrt Main and Auto Patch

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync-and-patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Config Repo
        uses: actions/checkout@v7
        with:
          path: config-repo

      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install OpenWrt Build Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gawk git gettext \
            libncurses5-dev libssl-dev python3 rsync unzip wget xsltproc \
            file quilt

      - name: Fetch OpenWrt Upstream
        run: |
          git clone --single-branch -b main https://github.com/openwrt/openwrt.git openwrt-src

      - name: Apply OpenWrt Tree Patches & Stage Kernel Patches
        run: |
          cd openwrt-src
          patch -p1 < ../config-repo/my_patches/0001-dts-add-bootargs-CMA-configured-reserved-men-settings.patch
          # mkdir -p target/linux/qualcommbe/patches-6.18/
          # cp ../config-repo/patches/target/linux/qualcommbe/patches-6.18/* target/linux/qualcommbe/patches-6.18/

      - name: Select Target (qualcommbe / ipq95xx)
        run: |
          cd openwrt-src
          echo "CONFIG_TARGET_qualcommbe=y" > .config
          echo "CONFIG_TARGET_qualcommbe_ipq95xx=y" >> .config
          echo "CONFIG_TARGET_qualcommbe_ipq95xx_DEVICE_askey_sbe1v1k=y" >> .config
          make defconfig
    
      - name: Prepare Upstream Baseline Sources
        run: |
          cd openwrt-src
          make target/linux/{download,prepare}
          make package/kernel/mac80211/{download,prepare}

      - name: Debug Quilt Patch State
        run: |
          cd openwrt-src
          echo "=== pwd ==="
          pwd
          echo "=== build_dir 是否存在 ==="
          ls -la build_dir/ 2>&1 || echo "build_dir 根本不存在"
          echo "=== build_dir 下的完整层级(如果有的话) ==="
          find build_dir -maxdepth 4 2>&1 || true
          echo "=== dl/ 缓存目录(确认内核tarball有没有下载下来) ==="
          ls -la dl/ 2>&1 | grep -i linux || echo "没找到 linux 内核 tarball"
          
      - name: Auto-Fix NAPI Budgets & Generate Kernel Patch
        run: |
          cd openwrt-src
          export ROOT_DIR=$PWD
          
          # 【修复1】精确获取真正的内核源码深层目录，形如 build_dir/.../linux-qualcommbe_ipq95xx/linux-6.18.44
          export ACTUAL_KERNEL_DIR=$(ls -d build_dir/target-*/linux-*/linux-6.* | grep -v 'orig' | head -n 1)
          echo "Exact kernel source dir: $ACTUAL_KERNEL_DIR"
          
          if [ -d "$ACTUAL_KERNEL_DIR" ]; then
            KERNEL_PARENT=$(dirname "$ACTUAL_KERNEL_DIR")
            KERNEL_BASENAME=$(basename "$ACTUAL_KERNEL_DIR")
            
            # 进入父目录，备份最深层的 linux-6.18.44 真实源码
            cd "$ROOT_DIR/$KERNEL_PARENT"
            cp -a "$KERNEL_BASENAME" "${KERNEL_BASENAME}.orig"
            
            # 调试辅助：打印出真实高通 edma 驱动的位置，帮你核对 Python 路径是否写错
            echo "=== Debug: Looking for qualcomm/ppe edma files ==="
            find "$KERNEL_BASENAME" -type f -name "edma*.c" | grep -iE "qualcomm|ppe" || echo "Warning: No edma files found for qualcomm!"
            
            # 回到根目录，执行 Python 脚本
            cd "$ROOT_DIR"
            
            # 强制导出最深层路径给 Python 脚本
            export KERNEL_DIR="$ROOT_DIR/$ACTUAL_KERNEL_DIR"
            python3 ../config-repo/scripts/fix_napi_budget.py
            
            # 对比 linux-6.18.44.orig 和 linux-6.18.44，生成标准 OpenWrt 补丁
            cd "$ROOT_DIR/$KERNEL_PARENT"
            PATCH_DIR="$ROOT_DIR/target/linux/qualcommbe/patches-6.18"
            mkdir -p "$PATCH_DIR"
            PATCH_FILE="$PATCH_DIR/999-dynamic-napi-budgets.patch"
            
            diff -urN "${KERNEL_BASENAME}.orig" "$KERNEL_BASENAME" > "$PATCH_FILE" || true
            
            # 清理备份的庞大内核文件夹
            rm -rf "${KERNEL_BASENAME}.orig"
            
            # 【修复2】严格检查补丁是否为空
            if [ ! -s "$PATCH_FILE" ]; then
              echo "❌ 错误: 生成的补丁是 0 字节！这意味着 Python 没有修改任何代码。"
              echo ">> 请立即检查 config-repo/scripts/fix_napi_budget.py："
              echo "1. subpath_hint 路径限制是否太严格？(建议把 'qualcomm/ppe' 放宽为 'qualcomm')"
              echo "2. .replace() 里的字符串空格、符号是否和原版源码存在细微差异？"
              exit 1
            fi
            
            echo "✅ 动态补丁生成成功！"
            cat "$PATCH_FILE" | head -n 20
          else
            echo "Error: Actual kernel directory not found."
            exit 1
          fi

      - name: Commit and Push to Branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd openwrt-src
          
          # 【修复2】删除官方自带的 GitHub Actions 目录，避开 workflows 修改权限拦截
          rm -rf .github

          # 切换到你的专属分支，这一步会继承官方 main 分支的所有历史提交！
          git checkout -b Askey_Spectrum_SBE1V1K
          
          # 配置 Git 机器人信息
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git remote add target "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"

          # 此时 git add . 会忽略 build_dir，但会准确捕捉到修改的 DTS 以及我们自动生成的 999 补丁
          git add .
          git commit -m "Auto-apply patches and dynamic NAPI configs for Askey SBE1V1K"

          # 连同官方完整的历史一起，强制推送到你的个人仓库分支中
          git push target Askey_Spectrum_SBE1V1K --force
