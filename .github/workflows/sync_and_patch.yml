name: Sync OpenWrt Main and Auto Patch

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync-and-patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Config Repo
        uses: actions/checkout@v7
        with:
          path: config-repo

      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install OpenWrt Build Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gawk git gettext \
            libncurses5-dev libssl-dev python3 rsync unzip wget xsltproc \
            file quilt

      - name: Fetch OpenWrt Upstream
        run: |
          git clone --depth 1 -b main https://github.com/openwrt/openwrt.git openwrt-src

      - name: Apply OpenWrt Tree Patches & Stage Kernel Patches
        run: |
          cd openwrt-src
          patch -p1 < ../config-repo/my_patches/0001-dts-add-bootargs-CMA-configured-reserved-men-settings.patch
          mkdir -p target/linux/qualcommbe/patches-6.18/
          cp ../config-repo/patches/target/linux/qualcommbe/patches-6.18/* target/linux/qualcommbe/patches-6.18/

      - name: Select Target (qualcommbe / ipq95xx)
        run: |
          cd openwrt-src
          echo "CONFIG_TARGET_qualcommbe=y" > .config
          echo "CONFIG_TARGET_qualcommbe_ipq95xx=y" >> .config
          # 如果需要锁定到具体设备 profile，请把下面这行换成实际 DEVICE symbol
          # （运行一次 `make menuconfig` 或查看 target/linux/qualcommbe/image/ipq95xx.mk 确认），
          # 省略此行不影响内核版本/patches-6.18 目录的选择，只影响最终镜像编译。
          echo "CONFIG_TARGET_qualcommbe_ipq95xx_DEVICE_askey_sbe1v1k=y" >> .config
          make defconfig

      - name: Prepare Upstream Baseline Sources
        run: |
          cd openwrt-src
          make target/linux/{download,prepare} QUILT=1 V=s
          make package/kernel/mac80211/{download,prepare} QUILT=1 V=s

      - name: Auto-Fix NAPI Budgets Dynamically (Robust Search)
        run: |
          cd openwrt-src
          
          # 找到解压后的 Linux 内核源码路径
          KERNEL_DIR=$(find build_dir/target-*/linux-* -maxdepth 1 -type d -name "linux-*" | head -n 1)
          echo "Found kernel dir: $KERNEL_DIR"
          
          if [ -d "$KERNEL_DIR" ]; then
            python3 -c "
            import os, glob

            kernel_dir = '$KERNEL_DIR'
            
            # 递归查找目标文件函数
            def find_file(filename):
                matches = []
                for root, dirs, files in os.walk(kernel_dir):
                    if filename in files:
                        matches.append(os.path.join(root, filename))
                return matches

            # 1. 修复 edma.c
            edma_files = find_file('edma.c')
            if edma_files:
                for p in edma_files:
                    print(f'Patching {p}...')
                    with open(p, 'r', encoding='utf-8', errors='ignore') as f: content = f.read()
                    content = content.replace('MODULE_PARM_DESC(edma_rx_napi_budget, \"Rx NAPI budget (default:128, min:16, max:512)\")', 'MODULE_PARM_DESC(edma_rx_napi_budget, \"Rx NAPI budget (default:64, min:16, max:64)\")')
                    content = content.replace('MODULE_PARM_DESC(edma_tx_napi_budget, \"Tx NAPI budget (default:512 for ipq95xx, min:16, max:512)\")', 'MODULE_PARM_DESC(edma_tx_napi_budget, \"Tx NAPI budget (default:64, min:16, max:64)\")')
                    content = content.replace('.napi_budget_tx = 512,', '.napi_budget_tx = 64,')
                    with open(p, 'w', encoding='utf-8') as f: f.write(content)
            else:
                print('[!] Warning: edma.c not found.')

            # 2. 修复 edma_cfg_rx.c
            for p in find_file('edma_cfg_rx.c'):
                print(f'Patching {p}...')
                with open(p, 'r', encoding='utf-8', errors='ignore') as f: content = f.read()
                content = content.replace('hw_info->napi_budget_rx', 'edma_rx_napi_budget')
                with open(p, 'w', encoding='utf-8') as f: f.write(content)

            # 3. 修复 edma_cfg_rx.h
            for p in find_file('edma_cfg_rx.h'):
                print(f'Patching {p}...')
                with open(p, 'r', encoding='utf-8', errors='ignore') as f: content = f.read()
                content = content.replace('#define EDMA_RX_NAPI_WORK_DEF\t\t128', '#define EDMA_RX_NAPI_WORK_DEF\t\t64')
                content = content.replace('#define EDMA_RX_NAPI_WORK_MAX\t\t512', '#define EDMA_RX_NAPI_WORK_MAX\t\t64')
                with open(p, 'w', encoding='utf-8') as f: f.write(content)

            # 4. 修复 edma_cfg_tx.c
            for p in find_file('edma_cfg_tx.c'):
                print(f'Patching {p}...')
                with open(p, 'r', encoding='utf-8', errors='ignore') as f: content = f.read()
                content = content.replace('hw_info->napi_budget_tx', 'edma_tx_napi_budget')
                with open(p, 'w', encoding='utf-8') as f: f.write(content)

            # 5. 修复 edma_cfg_tx.h
            for p in find_file('edma_cfg_tx.h'):
                print(f'Patching {p}...')
                with open(p, 'r', encoding='utf-8', errors='ignore') as f: content = f.read()
                content = content.replace('#define EDMA_TX_NAPI_WORK_DEF\t512', '#define EDMA_TX_NAPI_WORK_DEF\t64')
                content = content.replace('#define EDMA_TX_NAPI_WORK_MAX\t512', '#define EDMA_TX_NAPI_WORK_MAX\t64')
                with open(p, 'w', encoding='utf-8') as f: f.write(content)

            print('Successfully applied recursive dynamic kernel patches.')
            "
          else
            echo "Error: Kernel build directory not found."
            exit 1
          fi
          
      - name: Copy Custom Patches & Scripts
        run: |
          cp -r config-repo/patches openwrt-src/
          cp -r config-repo/scripts openwrt-src/

      - name: Run Auto-Patcher
        run: |
          cd openwrt-src
          chmod +x ./scripts/apply_patches.sh
          ./scripts/apply_patches.sh
        # 这一步只要 exit 1（存在冲突），job 直接失败，
        # 后面的清理/推送步骤会被 Actions 自动跳过，不需要额外的 if 判断。

      - name: Clean Overlay Dirs and Push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd openwrt-src
          rm -rf patches scripts

          git remote add target "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git checkout -b Askey_Spectrum_SBE1V1K

          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Auto-apply patches and config for Askey SBE1V1K"
          fi

          git push target Askey_Spectrum_SBE1V1K --force
